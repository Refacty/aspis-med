networks:
  aspismed_network:
    driver: bridge

services:
  mysql:
    image: mysql:8
    container_name: mysql8
    environment:
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_DATABASE: aspismed
      MYSQL_USER: goat
      MYSQL_PASSWORD: Refacty_db5498!#
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3308:3306"
    networks:
      - aspismed_network
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: aspismed-backend
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    networks:
      - aspismed_network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: aspismed-frontend
    environment:
      NEXTAUTH_URL: http://localhost
      NEXT_PUBLIC_API_URL: http://localhost/api
      NODE_ENV: production
    networks:
      - aspismed_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: aspismed-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
      - frontend
    networks:
      - aspismed_network
    restart: unless-stopped

volumes:
  mysql_data: